name: Deploy site

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "_config.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "site/**"
      - "_config.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
