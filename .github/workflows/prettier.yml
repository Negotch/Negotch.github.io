name: Prettier code formatter

on:
  pull_request:
    branches: [main, master]
    paths:
      - "site/**"
      - "_config.yml"
      - "README.md"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/broken-links-site.yml"
      - ".github/workflows/lighthouse-badger.yml"
      - ".github/workflows/update-tocs.yml"
      - ".github/workflows/prettier.yml"
      - "package.json"
      - "package-lock.json"
      - ".prettierrc"
      - ".prettierignore"
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "_config.yml"
      - "README.md"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/broken-links-site.yml"
      - ".github/workflows/lighthouse-badger.yml"
      - ".github/workflows/update-tocs.yml"
      - ".github/workflows/prettier.yml"
      - "package.json"
      - "package-lock.json"
      - ".prettierrc"
      - ".prettierignore"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install formatter
        run: npm ci
      - name: Check formatting
        run: >-
          npx --no-install prettier site _config.yml README.md
          .github/workflows/deploy.yml .github/workflows/broken-links-site.yml
          .github/workflows/lighthouse-badger.yml .github/workflows/update-tocs.yml
          .github/workflows/prettier.yml package.json package-lock.json .prettierrc
          --check
